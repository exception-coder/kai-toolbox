spring:
  ai:
    mcp:
      server:
        # 简历能力 MCP server(SSE 传输,挂在主端口 :18080)。SSE 端点默认 /sse,消息端点 /mcp/message。
        # 工具由 ResumeMcpConfig 的 ToolCallbackProvider 注册。MCP 客户端(Claude Code / 自有智能体)填
        # http://localhost:18080/sse 即可调。端点为 RouterFunction,不走 @SoftGuard(本机单用户,不暴露公网)。
        name: kai-toolbox-resume
        version: 0.1.0
        type: SYNC
        instructions: "kai-toolbox 简历能力:按 id 幂等增改/删除项目、工作、教育,字段级改基本信息,整组替换技能。改动前可先 resume_get 或 resume_list_projects 查看现状。"
    # 简历 AI 优化用的 LLM(OpenAI 兼容协议)。当前仅简历优化用到 chat 能力,故全局 spring.ai.openai 即此用途。
    # 默认 DeepSeek 远端;base-url 不带 /v1,OpenAiApi 会自动拼 /v1/chat/completions。
    #   DeepSeek : base-url=https://api.deepseek.com  model=deepseek-chat  需 TOOLBOX_RESUME_LLM_API_KEY
    #   本地 Ollama: base-url=http://localhost:11434  model=qwen2.5:7b     api-key 任意占位即可
    #   OpenAI   : base-url=https://api.openai.com    model=gpt-4o-mini
    # api-key 留占位符是为了让自动配置在本地 Ollama(无需 key)场景也能正常启动,真实 key 走环境变量。
    openai:
      base-url: ${TOOLBOX_RESUME_LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${TOOLBOX_RESUME_LLM_API_KEY:local-no-key-needed}
      chat:
        options:
          model: ${TOOLBOX_RESUME_LLM_MODEL:deepseek-chat}
          temperature: 0.4

toolbox:
  # 共享 LLM 网关（toolbox-llm）：模型池 + 分级路由 + 限流故障转移。
  # 同 tier 的多个成员构成一个池，按 weight 分发、对失败成员熔断退避（cooldown-ms）后转移到下一个。
  # 不配置任何 models 时，网关兜底用本地 Ollama qwen2.5:7b-instruct。
  llm:
    # 中心化 LLM 凭据（统一 OpenAI 兼容出口）：全站默认复用这一处，配置中心「LLM 网关」块在线可改。
    # 默认值链兼容旧 env：优先 TOOLBOX_LLM_*，回退旧的 TOOLBOX_AI_CHAT_*，再回退 4sapi。
    gateway:
      base-url: ${TOOLBOX_LLM_BASE_URL:${TOOLBOX_AI_CHAT_BASE_URL:https://4sapi.com/v1}}
      api-key: ${TOOLBOX_LLM_API_KEY:${TOOLBOX_AI_CHAT_API_KEY:}}
      timeout-seconds: ${TOOLBOX_LLM_TIMEOUT_SECONDS:60}
      java8gu-model: ${TOOLBOX_LLM_JAVA8GU_MODEL:gpt-4o-mini}
    models:
      - id: local-qwen
        tier: capture            # 记录态高频，用本地便宜模型
        base-url: http://localhost:11434/v1
        api-key: ollama
        model: qwen2.5:7b-instruct
        weight: 1
        cooldown-ms: 15000
      # 访客分析灰区判别（tier=visitor）：走 4sapi 外网模型（OpenAI 兼容中转），复用 ai-chat 的 4sapi key。
      # 未配 key 时 LangChain4j 调用失败 → GreyZoneService 降级为 UNKNOWN（后端标「待人工确认」），不影响主流程。
      - id: visitor-4sapi
        tier: visitor
        base-url: ${TOOLBOX_LLM_VISITOR_BASE_URL:https://4sapi.com/v1}
        api-key: ${TOOLBOX_LLM_VISITOR_KEY:${TOOLBOX_AI_CHAT_API_KEY:}}
        model: ${TOOLBOX_LLM_VISITOR_MODEL:gpt-4o-mini}
        weight: 1
        cooldown-ms: 15000
      # Java 八股「知识补全」(tier=java8gu)：把正文加工成图解(mermaid)/面试问答/易错点/深度讲解。
      # 需产出严格 JSON + 可渲染 mermaid，本地小模型质量不稳，故固定走 4sapi，复用同一把 key。
      # 未配 key 时补全调用失败 → Java8guEnrichService 降级为空补全，不影响原文展示。
      - id: java8gu-4sapi
        tier: java8gu
        base-url: ${TOOLBOX_LLM_JAVA8GU_BASE_URL:https://4sapi.com/v1}
        api-key: ${TOOLBOX_LLM_JAVA8GU_KEY:${TOOLBOX_AI_CHAT_API_KEY:}}
        model: ${TOOLBOX_LLM_JAVA8GU_MODEL:gpt-4o-mini}
        weight: 1
        cooldown-ms: 15000
      # 远端示例：与本地互为故障转移 / 限流时分摊（按需取消注释并配 key）
      # - id: deepseek
      #   tier: recall           # 回忆态多步推理，用更强的模型
      #   base-url: https://api.deepseek.com/v1
      #   api-key: ${TOOLBOX_LLM_DEEPSEEK_KEY:}
      #   model: deepseek-chat
      #   weight: 2
