toolbox:
  # AI 秘书向量 RAG（语义检索）。默认关闭——开启前置：
  #   1) ollama pull bge-m3   2) 启动 Qdrant: docker run -p 6333:6333 -p 6334:6334 qdrant/qdrant
  #   3) 把 enabled 改 true 重启。关闭时整套 RAG 不装配，回忆态退回工具路由。
  ai-secretary:
    rag:
      enabled: false
      embedding-base-url: http://localhost:11434/v1
      embedding-api-key: ollama
      embedding-model: bge-m3
      vector-size: 1024            # bge-m3 原生维度，换模型须同步改并重建集合
      qdrant-host: localhost
      qdrant-port: 6334            # gRPC 端口（REST 是 6333）
      qdrant-use-tls: false
      # Qdrant 开了 API Key 认证就填（须与 docker 的 QDRANT__SERVICE__API_KEY 一致）；留空=不认证
      qdrant-api-key: ${TOOLBOX_AI_SECRETARY_QDRANT_API_KEY:}
      collection: ai_secretary_notes
      max-results: 5
      # bge-m3 中文余弦分偏"压缩"：账号密码类 0.49~0.59、开销类 ≤0.43，0.45 卡在二者安全带中间
      # （实测「ERP 账号」对 kai-toolbox 那条 0.486，0.5 会误杀，故下调）
      min-score: 0.45
  # Java 八股复习秘书向量 RAG。独立集合 java8gu_cards，与个人秘书物理隔离。默认关闭，开启前置同上。
  # 复用同一 Qdrant：api-key 共享 ai-secretary 的环境变量，host/port 由启动脚本 -D 指向远端。
  java8gu:
    rag:
      enabled: false
      embedding-base-url: http://localhost:11434/v1
      embedding-api-key: ollama
      embedding-model: bge-m3
      vector-size: 1024
      qdrant-host: localhost
      qdrant-port: 6334
      qdrant-use-tls: false
      qdrant-api-key: ${TOOLBOX_AI_SECRETARY_QDRANT_API_KEY:}
      collection: java8gu_cards
      max-results: 6
      min-score: 0.45
      # 卡片内容目录（含 index.json 与 q/{id}.md）；相对路径按工作目录(仓库根)解析
      content-dir: frontend/public/java8gu
  # 访客分析智能体。确定性匹配（客户库/竞品名单）在 Java 完成；灰区分类已迁回 Java（LangChain4j）：
  # 模型经共享 LLM 网关（toolbox.llm）按 tier 取得——未配置该档位时回退默认（本地 Ollama）；
  # 要用更强的远端模型，在上面 toolbox.llm.models 加一个 tier=visitor 的成员（如 4sapi gpt-5-mini）。
  # 向量召回（历史相似客户）默认关闭，开启前置同 ai-secretary：① ollama pull bge-m3 ② 启动 Qdrant。
  visitor-analysis:
    tier: visitor
    # LLM 置信度低于此值的灰区判别进人工复核；确定性命中不受约束
    review-threshold: 0.7
    # 向量召回（Qdrant + 本地 Ollama bge-m3）。已纳入运行时配置中心（VisitorAnalysisRagProperties @Refreshable）：
    # Qdrant 地址/端口/Key/集合等可在配置中心查看与修改并持久化，便于发布到不同环境动态配置实际地址。
    # 连接相关项（host/port/api-key/enabled）改后需重启 agent 才重建连接生效；这里的值仅作启动默认/环境变量兜底。
    rag:
      enabled: true
      embedding-base-url: http://localhost:11434/v1
      embedding-api-key: ollama
      embedding-model: bge-m3
      vector-size: 1024            # bge-m3 原生维度，换模型须同步改并重建集合
      qdrant-host: ${TOOLBOX_QDRANT_HOST:170.106.186.65}
      qdrant-port: ${TOOLBOX_QDRANT_PORT:6334}    # gRPC 端口（REST 是 6333）
      qdrant-use-tls: false
      qdrant-api-key: ${TOOLBOX_QDRANT_API_KEY:}
      collection: va_customers     # 客户去重底库专用集合，与 ai-secretary 物理隔离
      max-results: 3
      min-score: 0.70              # 沿用原 sidecar VA_VECTOR_THRESH
    # 客户新增审批同步：定时从 Yoooni ERP 拉取未审批的「客户新增审批」记录登记，再异步判别是否重复客户。
    # 默认 enabled=false——配好 base-url/token（须与 Yoooni 侧 X-AI-Token 一致）再置 true 开启定时任务。
    # 标 @Refreshable（CustAddAuditSyncProperties）纳入运行时配置中心：base-url/token/超时等可在线改、不重启生效；
    # 这里的值仅作启动默认/环境变量兜底，运行期以配置中心覆盖为准。cron 改后需重启才重排。
    cust-add-audit-sync:
      enabled: ${TOOLBOX_VA_CUSTADD_SYNC_ENABLED:false}
      base-url: ${TOOLBOX_VA_YOOONI_BASE_URL:http://localhost:8080}
      token: ${TOOLBOX_VA_YOOONI_AI_TOKEN:yoooni-ai-agent-token-2026}
      default-since-date: "2026-06-01"   # 首轮/空表水位线
      pull-cron: "0 */10 * * * *"        # 拉取登记：每 10 分钟
      analyze-cron: "0 */2 * * * *"      # 异步判别：每 2 分钟
      batch-limit: 50
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
    # 客户底库同步：定时从 Yoooni 同步客户必要判定数据到本地 va_customer_ref（供精准去重 + 向量召回）。
    # 默认 enabled=false。标 @Refreshable：base-url/token/超时在线改即生效；cron 改后需重启。
    customer-sync:
      enabled: ${TOOLBOX_VA_CUSTSYNC_ENABLED:false}
      base-url: ${TOOLBOX_VA_YOOONI_BASE_URL:http://localhost:8080}
      token: ${TOOLBOX_VA_YOOONI_AI_TOKEN:yoooni-ai-agent-token-2026}
      full-cron: "0 30 2 * * *"          # 全量：每天 02:30
      incr-cron: "0 */30 * * * *"        # 增量：每 30 分钟
      batch-limit: 500
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
