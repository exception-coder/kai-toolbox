toolbox:

  claude-chat:
    # 一次性 Agent 任务超时：开发文档生成要先查代码/业务知识图谱再组织长文档，复杂需求
    # 实测经常超过 5 分钟。调大到 20 分钟；需求分诊/工时评估/进度评估等短任务也受益
    # （无副作用，超时只是 future.get 等待上限，正常几秒就返回的调用不会因为调大这个值而变慢）。
    agent-one-shot-timeout-ms: 1200000  # 20 分钟
    # DeepSeek Harness Developer Preview：有原生 Key 且锁定 SDK 的运行时握手通过才开放。
    # SDK 自带同版本 dsh；只读复用 ~/.dsh/.credentials.yaml，运行数据隔离到 Forge Harness Home。
    deepseek-harness:
      enabled: true
      command: ""           # 可选 dsh CLI JS 模块路径；留空自动使用 SDK 同版本运行时
      args: []               # 旧 Runtime argv 已不支持，必须留空
      provider: deepseek-official
      model: deepseek-flash
      max-tokens: 49152
      handshake-timeout-ms: 15000
      turn-timeout-ms: 1800000
    # 新建 Claude 会话时「工作目录下拉」的扫描配置。仅扫各 root 的一级子目录。
    # roots 为空 = 下拉为空，仍可手填 cwd。
    workspace:
      roots: []
        # - "D:\\Users\\zhang\\IdeaProjects"
      cache-ttl-seconds: 5
      hidden-prefixes:
        - "."
        - "_"
    # Forge 托管的业务系统源码。root 为空时使用 ~/.kai-toolbox/sources，
    # 无需额外配置，并自动纳入 Vibe Coding 与业务咨询的工作区列表。
    business-workspace:
      root: ""
      command-timeout-ms: 600000
