openapi: 3.0.3
info:
  title: Forge Business Consultation Backend Analysis
  version: 1.5.0
  description: 'Source contract, not deployment proof. SDK 0.4.0; new tasks default to FORGE_FLEX. Existing credentials, stored tasks and request recovery are preserved.'
servers:
  - url: http://127.0.0.1:18080
    description: Local-instance example only; replace port with the developer's verified Forge port. Never another colleague's machine.
  - url: https://forge-test.example.com
    description: Placeholder only; replace with the administrator-verified HTTPS test origin.
security:
  - ApplicationBearer: []
paths:
  /api/fore-consult/v1/attachments:
    post:
      operationId: uploadConsultImage
      description: 'Raw PNG/JPEG bytes, no multipart or URL. 1 byte–5MiB, at most 10000 per edge and 20 million pixels, no animation. clientId+uploadId binds SHA-256 and media type. Identical retry returns the original ID, changed input 409, expired 410. No automatic retry. Same key recovery window is 30 days; bytes expire after 24 hours. Per-client live bytes 25MiB, global 100MiB; retained metadata max 2000/client, 10000/global.'
      parameters:
        - { in: query, name: uploadId, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' } }
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary, minLength: 1, maxLength: 5242880 }
          image/jpeg:
            schema: { type: string, format: binary, minLength: 1, maxLength: 5242880 }
      responses:
        '200': { $ref: '#/components/responses/ImageResponse' }
        default: { $ref: '#/components/responses/Failure' }
    get:
      operationId: findConsultImageByUploadId
      description: 'Recover an uncertain upload using the original uploadId. Owner-only metadata, never image bytes. 404 for foreign or missing, 410 for expired.'
      parameters:
        - { in: query, name: uploadId, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' } }
      responses:
        '200': { $ref: '#/components/responses/ImageResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/v1/attachments/{attachmentId}:
    get:
      operationId: getConsultImageMetadata
      parameters:
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ImageResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/v1/token:
    post:
      operationId: issueConsultServiceToken
      security: [{ ApplicationBasic: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
      responses:
        '200':
          description: Short-lived opaque application token. No refresh token. Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: { type: string, pattern: '^fct_[A-Za-z0-9_-]{43}$' }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, maximum: 900 }
                  scope: { type: string, example: 'consult:analyze consult:read consult:cancel consult:attachments' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/v1/analysis-tasks:
    post:
      operationId: submitConsultAnalysis
      description: 'Persist input and requestId first. Same clientId/requestId and normalized input returns the original task; changed input is 409. Maximum body 192KiB, normalized input 100000 characters. No automatic replay.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisInput' }
      responses:
        '202':
          description: Registered or reused task, not proof of model success.
          headers:
            Location: { schema: { type: string }, description: Relative task-query path. }
            Retry-After: { schema: { type: string }, description: Suggested polling interval in seconds. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Failure' }
    get:
      operationId: findConsultAnalysisByRequest
      parameters:
        - { in: query, name: requestId, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/TaskResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/v1/analysis-tasks/{taskId}:
    parameters:
      - { in: path, name: taskId, required: true, schema: { type: string } }
    get:
      operationId: getConsultAnalysis
      responses:
        '200': { $ref: '#/components/responses/TaskResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/v1/analysis-tasks/{taskId}/cancel:
    parameters:
      - { in: path, name: taskId, required: true, schema: { type: string } }
    post:
      operationId: cancelConsultAnalysis
      description: CANCEL_REQUESTED is not a terminal state. Disconnecting does not cancel a task.
      responses:
        '202': { $ref: '#/components/responses/TaskResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/backend-clients:
    get:
      operationId: listConsultBackendClients
      security: [{ AdministratorBearer: [] }]
      description: Administrator metadata only, including when analysis is disabled. No secrets, hashes or tokens. Up to 200 matching grants.
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 }, description: Literal substring in appId, tenantId or clientId. }
      responses:
        '200':
          description: Current-instance configuration and safe grant metadata.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackendManagement' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      operationId: provisionConsultBackendClient
      description: Requires administrator authentication, including when analysis is disabled. A completed administrator/Idempotency-Key intent returns CREDENTIAL_ALREADY_ISSUED without returning the old secret. Independent grants for the same application remain supported.
      security: [{ AdministratorBearer: [] }]
      parameters:
        - { in: header, name: Idempotency-Key, required: false, schema: { type: string, format: uuid }, description: Stable issuance intent per administrator. Persist before sending and reuse after an unknown response. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [appId, tenantId, expiresAt]
              properties:
                appId: { $ref: '#/components/schemas/Identifier' }
                tenantId: { $ref: '#/components/schemas/Identifier' }
                projectIds:
                  type: array
                  maxItems: 8
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Identifier' }
                expiresAt: { type: integer, format: int64, description: Future epoch milliseconds, no more than one year. }
      responses:
        '200': { $ref: '#/components/responses/CredentialResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/backend-clients/{clientId}/rotate:
    parameters:
      - { in: path, name: clientId, required: true, schema: { type: string } }
    post:
      operationId: rotateConsultBackendClient
      security: [{ AdministratorBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expiresAt]
              properties:
                expiresAt: { type: integer, format: int64, description: Optional renewal, future epoch milliseconds within one year. Does not expand tenant or project scope. }
      responses:
        '200': { $ref: '#/components/responses/CredentialResponse' }
        default: { $ref: '#/components/responses/Failure' }
  /api/fore-consult/backend-clients/{clientId}/revoke:
    parameters:
      - { in: path, name: clientId, required: true, schema: { type: string } }
    post:
      operationId: revokeConsultBackendClient
      security: [{ AdministratorBearer: [] }]
      responses:
        '200':
          description: Revoked credential and its tokens; task records are retained.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        default: { $ref: '#/components/responses/Failure' }
components:
  securitySchemes:
    ApplicationBasic: { type: http, scheme: basic, description: Administrator-provisioned clientId and clientSecret; never employee credentials. }
    ApplicationBearer: { type: http, scheme: bearer, description: Opaque fct_ application token; never a platform user JWT. }
    AdministratorBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: Existing Forge administrator authentication. }
  responses:
    ImageResponse:
      description: 'Owner-only image metadata with Cache-Control no-store. Never original bytes or public file URL.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Image' }
    TaskResponse:
      description: Owner-only task snapshot with Cache-Control no-store.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Task' }
    CredentialResponse:
      description: One-time secret disclosure; Cache-Control no-store. Rotation invalidates old tokens immediately.
      content:
        application/json:
          schema:
            type: object
            required: [clientId, clientSecret, appId, tenantId, expiresAt, version]
            properties:
              clientId: { type: string }
              clientSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
              appId: { type: string }
              tenantId: { type: string }
              expiresAt: { type: integer, format: int64 }
              version: { type: integer, format: int64 }
    Failure:
      description: '400 invalid request; 401 invalid/expired/revoked credentials; 403 scope; 404 task/image absent or not owned; 409 idempotency conflict; 410 image expired; 413 size/dimensions; 415 image format; 422 image unreadable; 429 bounded capacity/rate; 503 disabled. Preserve original input and requestId/uploadId on uncertainty. Retry-After applies to 429/503. Model failures appear in the terminal task error, not as successful results.'
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/TaskError' }
              - type: object
                required: [traceId]
                properties:
                  traceId: { type: string }
  schemas:
    BackendManagement:
      type: object
      required: [enabled, clients, projects, truncated]
      properties:
        enabled: { type: boolean, description: Analysis feature switch loaded by this running instance. }
        truncated: { type: boolean, description: More than 200 matches; refine q. }
        projects:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        clients:
          type: array
          maxItems: 200
          items:
            type: object
            required: [clientId, appId, tenantId, projectIds, version, status, expiresAt, changedBy, changedAt]
            properties:
              clientId: { type: string }
              appId: { type: string }
              tenantId: { type: string }
              projectIds: { type: array, items: { type: string } }
              version: { type: integer, format: int64 }
              status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
              expiresAt: { type: integer, format: int64 }
              changedBy: { type: string, description: Last administrator ID, not a complete audit trail. }
              changedAt: { type: integer, format: int64 }
    Identifier: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }
    AnalysisInput:
      type: object
      additionalProperties: false
      required: [agentId, tenantId, problemId, conversationId, requestId, title, description]
      properties:
        agentId: { type: string, enum: [it-support-partner] }
        tenantId: { $ref: '#/components/schemas/Identifier' }
        problemId: { $ref: '#/components/schemas/Identifier' }
        conversationId: { $ref: '#/components/schemas/Identifier' }
        requestId: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 12000 }
        recentContext:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 2000 }
        classification:
          type: object
          additionalProperties: false
          required: [decision, reason]
          properties:
            decision: { type: string, enum: [IT, NOT_IT, UNKNOWN] }
            reason: { type: string, minLength: 1, maxLength: 2000 }
        systemIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Identifier' }
        errorText: { type: string, maxLength: 12000 }
        attachmentTexts:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [id, name, text]
            properties:
              id: { $ref: '#/components/schemas/Identifier' }
              name: { type: string, minLength: 1, maxLength: 200 }
              text: { type: string, minLength: 1, maxLength: 12000 }
        attachmentIds:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 'Original image IDs owned by this credential/enterprise. Total max 20MiB. Rechecked at execution. Expiry never silently degrades to text-only success.'
          items: { type: string, pattern: '^img_[a-f0-9-]{36}$' }
        replyMode:
          type: string
          enum: [FORGE_FLEX, CALLER, FORGE]
          default: FORGE_FLEX
          description: 'New tasks default to FORGE_FLEX (result 1.2, 0–8 useful replies). Existing request IDs retain original contracts. Explicit FORGE keeps three replies. Included in idempotency.'
        businessInstructions:
          type: string
          maxLength: 8000
          description: 'Optional caller business presentation/result rules for FORGE_FLEX only. Cannot authorize tools, identity changes or expanded resources.'
        businessContext:
          description: 'Optional non-null JSON, serialized max 16000 characters. Manual business material labelled CALLER_BUSINESS_CONTEXT, not independently verified system fact. FORGE_FLEX only.'
        evidenceRefs:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [projectId, path, startLine, endLine]
            properties:
              projectId: { $ref: '#/components/schemas/Identifier' }
              path: { type: string, minLength: 1, maxLength: 300, description: 'UTF-8 non-sensitive relative source path in the approved project. No URL or credentials. See BACKEND.md for extension and path policy.' }
              startLine: { type: integer, minimum: 1 }
              endLine: { type: integer, minimum: 1, description: At most 120 lines and 8000 characters per reference. }
    TextList:
      type: array
      maxItems: 8
      items: { type: string, minLength: 1, maxLength: 2000 }
    References:
      type: array
      maxItems: 8
      items: { type: string, description: Must be an actual server-supplied evidence ID. }
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, understanding, category, facts, possibleCauses, recommendations, missingInformation, unknowns, humanHandoff, evidence, evidenceLimitations, replyCandidatesGeneratedBy]
      oneOf:
        - properties:
            replyCandidatesGeneratedBy: { enum: [CALLER] }
            schemaVersion: { enum: ['1.0', '1.1'] }
          not: { required: [replyCandidates] }
        - required: [replyCandidates]
          properties:
            replyCandidatesGeneratedBy: { enum: [FORGE] }
            schemaVersion: { enum: ['1.1'] }
            replyCandidates: { minItems: 3, maxItems: 3 }
        - required: [businessResult, replyCandidates]
          properties:
            replyCandidatesGeneratedBy: { enum: [FORGE] }
            schemaVersion: { enum: ['1.2'] }
      properties:
        schemaVersion: { type: string, enum: ['1.0', '1.1', '1.2'], description: '1.2 for FORGE_FLEX, 1.0/1.1 retained for legacy modes.' }
        businessResult:
          type: object
          nullable: true
          description: 'Required for 1.2. Caller-rule result object (serialized max 16000 characters), or null if no rule/reliable result. Caller validates its own business schema.'
        understanding: { type: string, minLength: 1, maxLength: 2000 }
        category: { type: string, enum: [ACCESS, PRINTING, DATA, WORKFLOW, INTEGRATION, OTHER, UNKNOWN] }
        facts:
          type: array
          maxItems: 8
          items:
            type: object
            required: [text, evidenceIds]
            additionalProperties: false
            properties:
              text: { type: string, minLength: 1, maxLength: 2000 }
              evidenceIds:
                allOf:
                  - { $ref: '#/components/schemas/References' }
                  - { minItems: 1 }
        possibleCauses:
          type: array
          maxItems: 8
          items:
            type: object
            required: [description, confidence, evidenceIds]
            additionalProperties: false
            properties:
              description: { type: string, minLength: 1, maxLength: 2000 }
              confidence: { type: string, enum: [POSSIBLE, SUPPORTED] }
              evidenceIds: { $ref: '#/components/schemas/References' }
        recommendations: { $ref: '#/components/schemas/TextList' }
        evidenceLimitations: { type: string, description: Server-owned statement of actual evidence coverage. }
        missingInformation: { $ref: '#/components/schemas/TextList' }
        unknowns: { $ref: '#/components/schemas/TextList' }
        humanHandoff:
          type: object
          required: [recommended, reason]
          additionalProperties: false
          properties:
            recommended: { type: boolean }
            reason: { type: string, minLength: 1, maxLength: 2000 }
        evidence:
          type: array
          maxItems: 21
          items:
            type: object
            required: [id, kind, source, text]
            properties:
              id: { type: string }
              kind: { type: string, enum: [CALLER_DESCRIPTION, CALLER_BUSINESS_CONTEXT, CALLER_ERROR, CALLER_ATTACHMENT_TEXT, CALLER_IMAGE, SERVER_SOURCE] }
              source: { type: string, description: Opaque caller reference or approved project ID plus relative source location. }
              text: { type: string }
        replyCandidatesGeneratedBy: { type: string, enum: [CALLER, FORGE] }
        replyCandidates:
          type: array
          minItems: 0
          maxItems: 8
          description: '1.2: 0–8, zero requires humanHandoff recommended and a reason. Legacy 1.1/FORGE: exactly three. Stable reply-N IDs persisted; no duplicate filler; human confirmation required before sending.'
          items:
            type: object
            additionalProperties: false
            required: [id, text, evidenceIds]
            properties:
              id: { type: string, pattern: '^reply-[1-8]$' }
              text: { type: string, minLength: 1, maxLength: 4000 }
              evidenceIds:
                allOf:
                  - { $ref: '#/components/schemas/References' }
                  - { minItems: 1 }
        imageInputs:
          type: array
          maxItems: 5
          description: Actual image metadata passed to the managed multimodal runner. Not a promise that vision interpreted every pixel correctly.
          items: { $ref: '#/components/schemas/Image' }
        imageObservations:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [attachmentId, readable, observation]
            properties:
              attachmentId: { type: string }
              readable: { type: boolean, enum: [true], description: False makes the task fail IMAGE_NOT_READABLE. }
              observation: { type: string, minLength: 1, maxLength: 2000 }
    Image:
      type: object
      additionalProperties: false
      required: [attachmentId, uploadId, sha256, mediaType, size, width, height, createdAt, expiresAt]
      properties:
        attachmentId: { type: string, pattern: '^img_[a-f0-9-]{36}$' }
        uploadId: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        mediaType: { type: string, enum: [image/png, image/jpeg] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        width: { type: integer, minimum: 1, maximum: 10000 }
        height: { type: integer, minimum: 1, maximum: 10000 }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    TaskError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    Task:
      type: object
      required: [taskId, requestId, problemId, conversationId, status, result, error, createdAt, startedAt, finishedAt, policyVersion]
      properties:
        taskId: { type: string }
        requestId: { type: string }
        problemId: { type: string }
        conversationId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, CANCEL_REQUESTED, SUCCEEDED, NEEDS_INFORMATION, FAILED, CANCELLED, TIMED_OUT, INTERRUPTED] }
        result:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AnalysisResult' }]
        error:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TaskError' }]
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64, nullable: true }
        finishedAt: { type: integer, format: int64, nullable: true }
        policyVersion: { type: integer, format: int64, nullable: true }
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: string }
          description: Persisted task input IDs, present for image tasks, including failed tasks.
