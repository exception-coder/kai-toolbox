schema: spec-driven

context: |
  Read AGENTS.md for project rules, docs/INDEX.md for maintained knowledge, and
  docs/ai-coding-architecture.md for the AI workflow contract. Accepted behavior
  belongs in openspec/specs; changes describe only the current delta. Verify
  Graphify coordinates against current source; neither a graph nor structural
  spec validation proves runtime correctness.

  Keep planning proportional to the change. Prefer concise Chinese documents
  covering the goal, changed behavior, necessary implementation decisions and
  acceptance. Reuse existing material; omit irrelevant template sections and do
  not copy the same content across proposal, specs, design and tasks. A local
  bug fix that preserves behavior does not need a new change solely for process.
  Permissions, data safety, writer ownership and necessary acceptance remain.

rules:
  proposal:
    - Briefly state the problem, intended result, scope and affected capabilities. Add exclusions or open decisions only when they affect this change; do not add generic background or future roadmaps.
  specs:
    - Describe only changed observable behavior and necessary success/failure boundaries. Reuse existing requirements; scenarios are acceptance obligations, not a quota of new unit tests.
  design:
    - Explain the chosen implementation, affected contracts, concrete risks and smallest sufficient verification. Reuse existing designs and cite precise evidence; do not generate separate overview/detail documents, alternative comparisons, migration plans or empty sections without an actual need.
    - For navigation and AI workflows, record applicable product-philosophy IDs, object identity, feedback/recovery, keyboard/mobile handling and duplicate-action behavior concisely. Preserve unverified facts and necessary authorization boundaries.
  tasks:
    - Organize by usable features with concentrated targeted acceptance, not by files, endpoints or individual scenarios. Prefer existing checks; add tests only for concrete risk or an acceptance gap. Unchanged valid evidence can be reused; a turn or commit does not trigger full suites or builds.
    - Preserve task IDs and real completion evidence. Keep unfinished local work explicit; append only actual human confirmation or production operations as unchecked [MANUAL_CONFIRMATION] or [MANUAL_PRODUCTION] tasks, never relabel unfinished code to bypass acceptance.
    - When several local tasks share a reviewed verification boundary, use [VERIFY_GROUP:name] after their IDs; Runtime authorizes the bounded batch. Under CODING_FIRST, mark implemented but unverified tasks [IMPLEMENTED] and defer execution checks until the developer restores standard acceptance.
