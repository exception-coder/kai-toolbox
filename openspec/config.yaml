schema: spec-driven

context: |
  kai-toolbox uses AGENTS.md as the project rule and context router. Read
  docs/INDEX.md for human-maintained project knowledge. openspec/specs contains
  accepted behavior and openspec/changes contains proposed behavior. Graphify
  provides current implementation coordinates, not business truth.

  Before relying on Graphify, compare its manifest with Git HEAD and affected
  working-tree files. Verify exact behavior through targeted source and tests.
  OpenSpec structural validation does not replace implementation, database,
  runtime, or release-artifact verification.

rules:
  proposal:
    - Keep one change independently reviewable and state the goal, non-goals, evidence sources, and unresolved decisions.
  specs:
    - Describe observable behavior and scenarios rather than copied implementation structure.
  design:
    - Cite current source or Graphify coordinates and record verification and rollback strategy.
  tasks:
    - Split development work into bounded tasks with explicit local acceptance evidence. Keep production deployment, real-environment acceptance and human follow-up in final separate tasks; they must not prevent completion of verified local development.
    - For revisitable uncertainty, implement the recommended reversible solution with local tests and record assumptions, evidence, risks and extension points in design.md. Append a separate [MANUAL_CONFIRMATION] task for human review; never report an assumed source fact as verified.
    - When continuing a historical change, first split mixed development/manual tasks while preserving existing task IDs, completed evidence and unfinished local work. Append manual tasks at the end; do not simply relabel unfinished implementation as manual or mark it complete.
    - Keep tasks independently verifiable and do not mark them complete before evidence exists.
    - Separate locally verifiable development tasks from production-only validation and operations. Prefix each production-only task description with [MANUAL_PRODUCTION]; never use the marker for unfinished local code or tests. Keep marked tasks unchecked until a human completes production work.
