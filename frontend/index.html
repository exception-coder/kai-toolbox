    <style>
      body{margin:0}
      #boot-shell{min-height:100dvh;display:grid;grid-template-columns:64px 1fr;background:#f7f8fa;color:#18181b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}
      .boot-rail{display:grid;place-items:start center;padding-top:20px;border-right:1px solid rgba(0,0,0,.07);background:#f2f3f5}
      .boot-mark{font-size:13px;font-weight:650;letter-spacing:.08em}
      .boot-main header{height:48px;border-bottom:1px solid rgba(0,0,0,.07)}
      .boot-state{display:grid;gap:8px;padding:48px 40px}
      .boot-state strong{font-size:15px;font-weight:600;letter-spacing:-.01em}
      .boot-state span{font-size:13px;color:#71717a}
      .boot-content{padding:0 40px 32px;max-width:1100px}.boot-content[hidden]{display:none}
      .boot-skeleton-toolbar{display:flex;justify-content:space-between;gap:24px;margin:24px 0}
      .boot-skeleton-toolbar i{height:32px;width:40%;max-width:320px}.boot-skeleton-toolbar i:last-child{width:80px}
      .boot-skeleton-row{display:grid;grid-template-columns:2fr 1fr 64px;gap:24px;align-items:center;height:64px;border-top:1px solid rgba(0,0,0,.07)}
      .boot-skeleton-row i{height:12px;width:72%}.boot-skeleton-row i:last-child{height:20px;width:100%}
      .boot-content i{display:block;border-radius:4px;background:#e8eaee;animation:boot-pulse 2s ease-in-out infinite}
      .boot-menu summary{min-height:44px;box-sizing:border-box;padding:12px 40px;cursor:pointer;font-size:14px}
      .boot-home{display:inline-flex;align-items:center;min-height:44px;color:inherit;font-size:13px;text-underline-offset:4px}
      @keyframes boot-pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.boot-content i{animation:none}}
      @media(max-width:640px){.boot-content{padding:0 24px 24px}.boot-menu summary{padding:12px 24px}.boot-skeleton-row{grid-template-columns:1fr 64px;gap:16px}.boot-skeleton-row i:nth-child(2){display:none}}
      @media(prefers-color-scheme:dark){.boot-content i{background:#272b32}.boot-skeleton-row{border-color:rgba(255,255,255,.08)}}
      .boot-navigation{padding:0 40px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;max-width:1100px}
      .boot-navigation[hidden]{display:none}.boot-navigation h2{font-size:12px;font-weight:500;color:#71717a;margin:0 0 8px}.boot-navigation ul{list-style:none;margin:0;padding:0}
      .boot-navigation a{display:flex;align-items:center;min-height:44px;padding:4px 0;color:inherit;text-decoration:none;border-bottom:1px solid rgba(0,0,0,.07);font-size:15px}.boot-navigation a:hover{text-decoration:underline}.boot-navigation a:focus-visible,.boot-retry:focus-visible{outline:2px solid #545ce8;outline-offset:2px}
      .boot-progress{padding:0 40px 24px;font-size:12px;color:#71717a}.boot-retry{margin-left:12px;border:1px solid #c8ccd3;border-radius:8px;padding:8px 12px;background:transparent;color:inherit;cursor:pointer;min-height:44px}
      @media(max-width:640px){.boot-navigation{padding:0 24px 24px;grid-template-columns:1fr}.boot-progress{padding:0 24px 24px}}
      @media(max-width:640px){#boot-shell{grid-template-columns:1fr;grid-template-rows:48px 1fr}.boot-rail{place-items:center start;padding:0 20px;border-right:0;border-bottom:1px solid rgba(0,0,0,.07)}.boot-main header{display:none}.boot-state{padding:32px 24px}}
      @media(prefers-color-scheme:dark){#boot-shell{background:#15171a;color:#f4f4f5}.boot-rail{background:#111316}.boot-rail,.boot-main header,.boot-navigation a{border-color:rgba(255,255,255,.08)}.boot-state span,.boot-navigation h2,.boot-progress{color:#a1a1aa}.boot-retry{border-color:#50545b}}

    <script>
      setTimeout(() => {
        const retry = document.getElementById('boot-retry')
        if (retry) retry.hidden = false
        const progress = document.getElementById('boot-progress')
        if (progress) progress.textContent = '连接比平时慢，可重新加载；已有导航仍可使用。'
      }, 10000)
      if (location.pathname === '/tools/claude-chat') {
        const traceId = crypto.randomUUID()
        window.__vibeBootTraceId = traceId
        setTimeout(() => {
          if (!document.getElementById('boot-shell')) return
          const token = localStorage.getItem('toolbox.auth.token')
          if (!token) return
          fetch('/api/claude-chat/diagnostics/entry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ traceId, stage: 'bootstrap_timeout', status: 'timeout',
              elapsedMs: Math.min(Math.round(performance.now()), 600000), sessionId: null }),
          }).catch(() => {})
        }, 10000)
      }
    </script>
    <script type="module" vite-ignore>
      if (document.querySelector('script[src="/@vite/client"]')

        import('/src/features/claude-chat/pages/ChatControlWorkspace.tsx')
      }
    </script>
