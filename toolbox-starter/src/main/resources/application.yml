spring:
  application:
    name: kai-toolbox
  profiles:
    default: dev
  config:
    import:
      - classpath:config/common/toolbox-core.yml
      - classpath:config/common/toolbox-llm.yml
      - classpath:config/common/toolbox-ai-chat.yml
      - classpath:config/common/toolbox-ai-secretary.yml
      - classpath:config/common/toolbox-media.yml
      - classpath:config/common/toolbox-projects.yml
      - classpath:config/common/toolbox-claude-chat.yml
      - classpath:config/common/toolbox-browser-request.yml
      - classpath:config/common/toolbox-vscode-tunnel.yml
      - classpath:config/common/toolbox-downloader.yml
      - classpath:config/common/toolbox-magnet.yml
      - classpath:config/common/toolbox-auth.yml
      - classpath:config/common/supplier-quote.yml
  devtools:
    restart:
      # 存盘即热重启默认关：重启时机由人控制（supervisor 的 POST /restart）。
      # 热重启换的是 Spring 上下文而非 JVM，旧上下文的后台线程/长连接会活下来继续干活
      # （claude-chat 的 sidecar 客户端就踩过：僵尸 bean 继续抢 sidecar、事件投递到没人看的一端）；
      # 编译中途的半成品 class 也会触发无意义的重启。要热重启用 run-supervised.ps1 -HotReload，
      # 它会用系统属性把这里顶回 true。
      enabled: false
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: -1            # SSE 长连接，禁用超时
  servlet:
    multipart:
      # claude-chat 附件上传上限；留余量让 AttachmentStorageService 的 50MB 应用层校验先返回友好错误
      max-file-size: 60MB
      max-request-size: 70MB


server:
  port: 18080
  compression:
    enabled: true

logging:
  level:
    root: INFO
    # langchain4j 每次重试都 WARN + 打完整栈；端点不可达时刷屏。最终成败由业务代码兜底并打简讯，
    # 这里压掉重试噪音（仍保留 ERROR）。
    dev.langchain4j.internal.RetryUtils: 'ERROR'
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
